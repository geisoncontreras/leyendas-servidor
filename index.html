		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">

			<div id="status-notice"></div>

		<!-- ldp-actualizar -->
<script>
// Actualización automática (Leyendas del Puño): esta página es la versión
// 39. Antes de cargar el juego se pregunta cuál es la última publicada.
(function () {
	const VERSION = 39;
	function aviso(texto) {
		let d = document.getElementById('ldp-aviso');
		if (!d) {
			d = document.createElement('div');
			d.id = 'ldp-aviso';
			d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
				+ 'background:#1a0d08;color:#ffd34a;font:bold 28px sans-serif;text-align:center;z-index:99;padding:16px';
			document.body.appendChild(d);
		}
		d.textContent = texto;
	}
	// Borra lo que el navegador guardó del juego y vuelve a cargar la página.
	window.ldpActualizar = async function (nueva) {
		const llave = 'ldp_intento_' + nueva;
		try {
			if (sessionStorage.getItem(llave)) { return false; }   // ya se intentó: no repetir
			sessionStorage.setItem(llave, '1');
		} catch (e) { /* sin almacenamiento: igual se intenta una vez */ }
		aviso('¡Versión nueva! Actualizando…');
		try {
			const regs = await navigator.serviceWorker.getRegistrations();
			await Promise.all(regs.map((r) => r.unregister()));
		} catch (e) { /* sin service worker */ }
		try {
			const keys = await caches.keys();
			await Promise.all(keys.map((k) => caches.delete(k)));
		} catch (e) { /* sin caché */ }
		try { await fetch('index.html', { cache: 'reload' }); } catch (e) { /* sin red */ }
		location.reload();
		return true;
	};
	// Devuelve una promesa: se cumple cuando se puede arrancar ESTA versión.
	window.ldpRevisar = async function () {
		try {
			const ctl = new AbortController();
			setTimeout(() => ctl.abort(), 4000);   // sin red o lenta: se juega igual
			const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
			const v = await r.json();
			if (Number(v.code) > VERSION && await window.ldpActualizar(Number(v.code))) {
				await new Promise(() => {});   // la página se está recargando
			}
		} catch (e) { /* sin red: se juega con esta versión */ }
	};
}());
</script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.wasm":43699190,"index.pck?v=39":35157760},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js","mainPack":"index.pck?v=39"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

window.ldpRevisar().then(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
});
		</script>
